# ============================================================
# Baby Monitor - Child Distress & Safety Monitor Config
# ============================================================

source:
  type: "webcam"          # webcam | rtsp | file
  device_id: 0
  rtsp_url: ""
  file_path: ""

output:
  show_video: true
  save_video: false
  output_path: "output/recorded.mp4"
  fps: 25
  resolution: [1280, 720]

model:
  weights: "yolo11n-pose.pt"   # yolo11n-pose | yolo11s-pose | yolo11m-pose
  confidence: 0.45
  iou: 0.65
  dedup_iou: 0.45
  device: "auto"
  imgsz: 640

classes:
  person_class_id: 0

# ─────────────────────────────────────────────────────────────
# EMOTION — Facial Emotion Recognition
# ─────────────────────────────────────────────────────────────
# 7 ta emotion: Angry, Disgust, Fear, Happy, Sad, Surprise, Neutral.
# cry_emotions = DISTRESS sifatida hisoblanadigan emotionlar:
#   Sad     → yig'lash
#   Fear    → qo'rqish
#   Angry   → g'azab / isteriya
#   Disgust → jirkanish / og'riq
emotion:
  enabled: true
  cry_emotions: ["Sad", "Fear", "Angry", "Disgust"]
  min_confidence: 0.40
  run_every_n_frames: 2      # FIX: eski 5 → 2 (yaxshiroq responsiveness)

# ─────────────────────────────────────────────────────────────
# POSE — Body language distress
# ─────────────────────────────────────────────────────────────
# 5 ta signal:
#   arms_raised — qo'l yelka ustida (qo'rqish, himoya)
#   torso_curl  — bosh yelka pastida (yig'lash, gavda burishish)
#   head_droop  — bosh osilgan (yig'lash, og'riq, charchoq)
#   lying_down  — gorizontal pozitsiya (yiqilgan / yotgan)
#   body_shake  — tez tebranish (isteriya, og'ir yig'lash)
pose:
  enabled: true
  distress_score_threshold: 0.4

# ─────────────────────────────────────────────────────────────
# AUDIO — FFT cry detection (mikrofon)
# ─────────────────────────────────────────────────────────────
# Bola yig'i odatda 300-1000 Hz oralig'ida bo'ladi.
# Endi cry_score (soft 0..1) TO'LIQ combined logikaga qo'shiladi.
audio:
  enabled: true                  # mikrofondan foydalanish
  sample_rate: 16000
  chunk_size: 1024
  cry_frequency_min: 300         # Hz
  cry_frequency_max: 1000        # Hz
  cry_amplitude_threshold: 0.3   # minimal volume (0..1)

# ─────────────────────────────────────────────────────────────
# FUSION — Multi-modal distress detection vaznlari
# ─────────────────────────────────────────────────────────────
# combined = face*w_face + audio*w_audio + pose*w_pose + motion*w_motion
#
# is_distress agar:
#   combined >= combined_threshold      (umumiy o'rtacha yuqori)
#   YOKI 2+ ta signal >= strong_signal_threshold
#   YOKI bittasi >= very_strong_threshold
#
# Agar audio o'chirilgan bo'lsa, audio_weight motion ga avtomatik o'tadi.
fusion:
  face_weight: 0.40              # FER — eng ishonchli (training data 95%)
  audio_weight: 0.35             # Audio FFT — direktan cry signal
  pose_weight: 0.20              # Pose — supporting signal
  motion_weight: 0.05            # Motion — eng oxirgi chora

  combined_threshold: 0.45       # weighted average distress threshold
  strong_signal_threshold: 0.55  # bitta signal "kuchli" bo'lishi uchun
  very_strong_threshold: 0.70    # bitta signal o'zi yetarli bo'lishi uchun

# ─────────────────────────────────────────────────────────────
# Inappropriate touch detection
# ─────────────────────────────────────────────────────────────
touch:
  enabled: true
  warn_seconds: 3.0           # TOUCH_WARN      head / sensitive zone
  alert_seconds: 5.0          # TOUCH_ALERT     chest / groin (private)
  emergency_seconds: 10.0     # TOUCH_EMERGENCY private + distress
  event_gap_seconds: 2.0
  alert_cooldown_seconds: 30.0
  edge_margin: 0.05

alone:
  adult_height_ratio: 0.50
  child_height_ratio: 0.40
  use_size_filter: true
  tracker_max_dist_ratio: 0.15
  tracker_max_miss: 5

alerts:
  alone_window_seconds: 240
  cry_window_seconds: 240
  cry_ratio_threshold: 0.70
  alert_cooldown_seconds: 60

notification:
  console: true
  sound_alert: true
  telegram:
    enabled: false
    bot_token: "YOUR_BOT_TOKEN"
    chat_id: "YOUR_CHAT_ID"
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender: "your@email.com"
    password: "your_app_password"
    recipient: "recipient@email.com"

logging:
  level: "INFO"
  file: "logs/monitor.log"
  max_size_mb: 10
